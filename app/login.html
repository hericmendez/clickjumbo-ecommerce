<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
      crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    
    <!-- Seus estilos -->
    <link rel="stylesheet" href="css/login.css" />
    <link rel="stylesheet" href="css/footer.css" />

    <title>Login</title>
<style>
  body {
    font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
  }

  .brand-logo {
    max-width: 240px;
    width: 100%;
  }

  .login-card {
    max-width: 420px;
  }

  .input-group .form-control {
    border-right: 0;
  }

  .input-group .btn-toggle {
    border-left: 0;
  }

  /* opcional: foco mais evidente */
  .form-control:focus {
    box-shadow: 0 0 0 .2rem rgba(13, 110, 253, .25);
  }
</style>
  </head>

  <body class="bg-light d-flex flex-column min-vh-100">
    <!-- Navbar (carregada via JS) -->
    <div id="navbar"></div>

    <!-- Main -->
    <main class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
      <div class="card shadow-sm login-card w-100">
        <div class="card-body p-4 p-sm-5">
          <div class="text-center mb-4">
            <img src="assets/logo_full.png" alt="ClickJumbo" class="brand-logo img-fluid">
          </div>

          <h1 class="h4 text-center mb-4 fw-bold">Acessar conta</h1>
          
          <form id="form" autocomplete="on" novalidate>
            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
                <input
                  id="email"
                  name="email"
                  type="email"
                  class="form-control"
                  placeholder="seu@email.com"
                  autocomplete="email"
                  required
                />
              </div>
              <div class="invalid-feedback">Informe um email válido.</div>
              </div>

            <!-- Senha com olho -->
            <div class="mb-3">
              <label for="password" class="form-label">Senha</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input
                  id="password"
                  name="password"
                  type="password"
                  class="form-control"
                  placeholder="Digite sua senha"
                  autocomplete="current-password"
                  required
                />
                <button id="togglePassword" type="button" class="btn btn-outline-secondary btn-toggle" aria-label="Exibir senha">
                  <i class="fa-regular fa-eye" aria-hidden="true"></i>
                </button>
                </div>
                <div class="form-text">Use 8+ caracteres, misturando letras e números.</div>
                </div>

            <!-- Submit -->
            <div class="d-grid gap-2">
              <button class="btn btn-success" type="submit">Entrar</button>
            </div>

            <!-- Link cadastro -->
            <div class="text-end mt-3">
              <a href="./signup.html" class="text-decoration-none">Novo por aqui? Cadastre-se</a>
              </div>
              </form>
        </div>
        </div>
        </main>

    <!-- Footer (carregado via JS) -->
    <div id="footerDiv" class="mt-auto"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"></script>

    <!-- Componentes existentes -->
    <script type="module" src="components/navbar.script.js"></script>
    <script type="module" src="components/footer.script.js"></script>
<!-- Login logic existente -->
    <script type="module" src="scripts/login.js"></script>

    <!-- Toggle de senha (leve e isolado) -->
    <script>
      (function () {
        const input = document.getElementById('password');
        const btn = document.getElementById('togglePassword');
        const icon = btn.querySelector('i');

        btn.addEventListener('click', () => {
          const isHidden = input.type === 'password';
          input.type = isHidden ? 'text' : 'password';
          // alterna ícone
          icon.classList.toggle('fa-eye', !isHidden);
          icon.classList.toggle('fa-eye-slash', isHidden);
          // acessibilidade
          btn.setAttribute('aria-label', isHidden ? 'Ocultar senha' : 'Exibir senha');
          // mantém foco no input (qualidade de vida)
          input.focus({ preventScroll: true });
        });

        // validação básica bootstrap (opcional)
        const form = document.getElementById('form');
        form.addEventListener('submit', (e) => {
          if (!form.checkValidity()) {
            e.preventDefault();
            e.stopPropagation();
          }
          form.classList.add('was-validated');
        });
      })();
    </script>
  </body>
</html>
