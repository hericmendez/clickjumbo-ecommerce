<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"

    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"

    <link

      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <link rel="stylesheet" href="css/cart.css" />
    <link rel="stylesheet" href="css/footer.css" />

    <title>Checkout - Carrinho</title>
  </head>
    <div id="loadingSpinner" class="spinner-overlay" style="display: none">
      <div class="spinner text-primary" role="status" style="width: 4rem; height: 4rem">
        <span class="visually-hidden">Carregando...</span>
      </div>
    </div>
    <div id="navbar"></div>
  <!-- Modal de Detalhes do Pedido -->
<div class="modal fade" id="orderDetailsModal" tabindex="-1" aria-labelledby="orderDetailsLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="orderDetailsLabel">Detalhes do Pedido</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body" id="orderDetailsContent">Carregando...</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
        </div>
      </div>
    </div>
  </div>
<body>
  <div id="navbar"></div>

  <!-- Modal de Detalhes do Pedido -->
  <div class="modal fade" id="orderDetailsModal" tabindex="-1" aria-labelledby="orderDetailsLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="orderDetailsLabel">Detalhes do Pedido</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
        </div>
        <div class="modal-body" id="orderDetailsContent">Carregando...</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Fechar</button>
        </div>
      </div>
    </div>
  </div>

  <main class="container py-4 min-vh-100">
    <h3 class="mb-3">🛒 Suas compras</h3>
    <div class="table-responsive">
      <table class="table table-striped table-bordered">
        <thead class="table-dark">
          <tr>
            <th>#Pedido</th>
            <th>Penitenciária</th>
            <th>Status</th>
            <th>Valor Total</th>
            <th>Data</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="ordersTableBody"></tbody>
        </table>
        </div>
<!-- Paginação -->
<nav class="mt-3">
  <ul class="pagination justify-content-center" id="ordersPagination"></ul>
</nav>
  </main>

  <div id="notifyDiv1"></div>
  <div id="notifyDiv2"></div>
  <div id="footerDiv" class="mt-5"></div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" crossorigin="anonymous"
    referrerpolicy="no-referrer"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="components/navbar.script.js"></script>
  <script type="module" src="components/footer.script.js"></script>
  <script type="module" src="scripts/orders.js"></script>

</html>
