<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap & Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />

    <!-- Seus estilos -->
    <link rel="stylesheet" href="css/signup.css" />
    <link rel="stylesheet" href="css/footer.css" />

    <title>Cadastro</title>

    <style>
      body {
        font-family: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      }
    
      .brand-logo {
        max-width: 240px;
        width: 100%;
      }
    
      .signup-card {
        max-width: 480px;
      }
    
      .input-group .form-control {
        border-right: 0;
      }
    
      .input-group .btn-toggle {
        border-left: 0;
      }
    
      .form-control:focus {
        box-shadow: 0 0 0 .2rem rgba(13, 110, 253, .25);
      }
    </style>
  </head>

  <body class="bg-light d-flex flex-column min-vh-100">
    <!-- Navbar -->
    <div id="navbar"></div>

    <!-- Main -->
    <main class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
      <div class="card shadow-sm signup-card w-100">
        <div class="card-body p-4 p-sm-5">
          <div class="text-center mb-4">
            <img src="assets/logo_full.png" alt="ClickJumbo" class="brand-logo img-fluid" />
          </div>

          <h1 class="h4 text-center mb-4 fw-bold">Criar conta</h1>
          
          <form id="form" autocomplete="on" novalidate>
            <!-- Nome de usuário -->
            <div class="mb-3">
              <label for="username" class="form-label">Nome de usuário</label>
              <div class="input-group">
                <span class="input-group-text"><i class="fa-regular fa-user"></i></span>
                <input class="form-control" id="username"
                  name="username"
                  type="text"
                  placeholder="Seu nome de usuário"
                  required
                />
              </div>
              <div class="invalid-feedback">Informe um nome de usuário.</div>
              </div>
              
              <!-- Email -->
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa-regular fa-envelope"></i></span>
                <input class="form-control" id="email"
                  name="email"
                  type="email"
                  placeholder="seu@email.com"
                  autocomplete="email"
                  required
                />
              </div>
              <div class="invalid-feedback">Informe um email válido.</div>
              </div>
              
              <!-- Senha -->
              <div class="mb-3">
                <label for="password" class="form-label">Senha</label>
                <div class="input-group">
                  <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input class="form-control" id="password"
                  name="password"
                  type="password"
                  placeholder="Crie uma senha"
                  autocomplete="new-password"
                  minlength="8"
                  required
                />
                <button id="togglePassword" type="button" class="btn btn-outline-secondary btn-toggle" aria-label="Exibir senha">
                  <i class="fa-regular fa-eye" aria-hidden="true"></i>
                </button>
                </div>
                <div class="form-text">Mínimo de 8 caracteres.</div>
                <div class="invalid-feedback">Senha muito curta (mínimo 8).</div>
                </div>
                
                <!-- Confirmar senha -->
                <div class="mb-3">
                  <label for="confirm" class="form-label">Confirmar senha</label>
                  <div class="input-group">
                    <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                <input class="form-control" id="confirm"
                  name="confirm"
                  type="password"
                  placeholder="Repita a senha"
                  autocomplete="new-password"
                  minlength="8"
                  required
                />
                <button id="toggleConfirm" type="button" class="btn btn-outline-secondary btn-toggle"
                  aria-label="Exibir confirmação de senha">
                  <i class="fa-regular fa-eye" aria-hidden="true"></i>
                  </button>
              </div>
              <div class="invalid-feedback" id="confirmFeedback">As senhas não coincidem.</div>
              </div>
              
              <!-- Submit -->
              <div class="d-grid gap-2">
                <button class="btn btn-success" type="submit">Cadastrar</button>
              </div>
              
              <!-- Link para login -->
              <div class="mt-3 text-end">
                <a href="/app/login.html" class="text-decoration-none">Já tem conta? Faça login</a>
            </div>
            </form>
        </div>
        </div>
        </main>

    <!-- Footer -->
    <div id="footerDiv" class="mt-auto"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"></script>

    <!-- Navbar e Footer -->
    <script type="module" src="components/navbar.script.js"></script>
    <script type="module" src="components/footer.script.js"></script>

    <!-- Script de cadastro existente -->
    <script type="module" src="scripts/signup.js"></script>

    <!-- Toggle de senhas + validação (não conflita com signup.js) -->
    <script>
      (function () {
        const form = document.getElementById('form');
        const pwd = document.getElementById('password');
        const conf = document.getElementById('confirm');
        const confirmFeedback = document.getElementById('confirmFeedback');

        function setupToggle(inputId, btnId) {
          const input = document.getElementById(inputId);
          const btn = document.getElementById(btnId);
          const icon = btn.querySelector('i');

          btn.addEventListener('click', () => {
            const isHidden = input.type === 'password';
            input.type = isHidden ? 'text' : 'password';
            icon.classList.toggle('fa-eye', !isHidden);
            icon.classList.toggle('fa-eye-slash', isHidden);
            btn.setAttribute('aria-label', isHidden ? 'Ocultar senha' : 'Exibir senha');
            input.focus({ preventScroll: true });
          });
        }

        setupToggle('password', 'togglePassword');
        setupToggle('confirm', 'toggleConfirm');

        // Validação Bootstrap + match de senhas
        function passwordsMatch() {
          return pwd.value && conf.value && pwd.value === conf.value;
        }

        conf.addEventListener('input', () => {
          if (passwordsMatch()) {
            conf.setCustomValidity('');
            confirmFeedback.textContent = 'Ok!';
          } else {
            conf.setCustomValidity('Mismatch');
            confirmFeedback.textContent = 'As senhas não coincidem.';
          }
        });

        form.addEventListener('submit', (e) => {
          // força revalidação do match
          if (!passwordsMatch()) conf.setCustomValidity('Mismatch');
          else conf.setCustomValidity('');

          if (!form.checkValidity()) {
            e.preventDefault();
            e.stopPropagation();
          }
          form.classList.add('was-validated');
        });
      })();
    </script>
    </body>
    
    </html>
