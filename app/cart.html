<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <link rel="stylesheet" href="css/cart.css" />
  <link rel="stylesheet" href="css/footer.css" />

  <title>Checkout - Carrinho</title>
</head>

<body>
  <div id="loadingSpinner" class="spinner-overlay" style="display: none">
    <div class="spinner text-primary" role="status" style="width: 4rem; height: 4rem">
      <span class="visually-hidden">Carregando...</span>
    </div>
  </div>
  <div id="navbar"></div>

  <main class="container py-4">
    <h3 class="mb-3">🛒 Seu Carrinho</h3>
    <div id="display" class="cartItemList mb-4"></div>

    <div class="card">
      <div class="card-header fs-4 fw-bold text-center">Finalizar Pedido</div>
      <div class="card-body">
        <div id="qtdeTotal" class="mb-4"></div>



              <button type="submit" id="btnContinuar" class="btn btn-success w-100" disabled>
              Próximo
            </button>

      </div>
      
    </div>
  </main>

  <div id="notifyDiv1"></div>
  <div id="notifyDiv2"></div>
  <div id="footerDiv" class="mt-5"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="components/navbar.script.js"></script>
  <script type="module" src="components/footer.script.js"></script>
  <script type="module" src="scripts/cart.js"></script>
</body>

</html>
